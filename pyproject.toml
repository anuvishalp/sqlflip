[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlflip"
version = "0.1.1"
description = "Detect a SQL query's dialect and view it in PostgreSQL, MySQL, SQL Server and standard SQL."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "anuvishalp", email = "anuvishalp@gmail.com"}]
requires-python = ">=3.8"
keywords = ["sql", "postgresql", "mysql", "tsql", "sqlserver", "sql-converter", "sql-dialect"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/anuvishalp/sqlflip-view"
Source = "https://github.com/anuvishalp/sqlflip-view"
Issues = "https://github.com/anuvishalp/sqlflip-view/issues"

[project.scripts]
sqlflip = "sqlflip.cli:main"
sqlflip-gui = "sqlflip.gui:main"

[tool.setuptools.packages.find]
where = ["src"]